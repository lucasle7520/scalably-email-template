<!-- Add Google Fonts Poppins import and apply font-family -->
<link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,600&display=swap" rel="stylesheet" />
<div style="
    height: 100%;
    padding: 40px 16px;
    background: url({{BackgroundEmailImage}})
      center center / cover no-repeat;
    font-family: 'Poppins', Arial, Helvetica, sans-serif;
    font-size: 14px;
  ">
  <!-- Main card -->
  <div style="
      background: rgba(255, 255, 255, 0.95);
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      padding: 24px 16px;
      margin-top: 40px;
      font-family: 'Poppins', Arial, Helvetica, sans-serif;
      font-size: 14px;
    ">
    <!-- Community header -->
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        margin-bottom: 24px;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 20px;
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
      ">
      <tr>
        <td width="40" valign="middle" style="padding-right: 12px">
          <img
            src="{{CommunityAvatar}}"
            alt="Group Avatar"
            style="width: 40px; height: 40px; border-radius: 50%; display: block" />
        </td>
        <td valign="middle">
          <div
            style="
              font-size: 1rem;
              font-weight: 600;
              color: #1a1a1a;
              font-family: 'Poppins', Arial, Helvetica, sans-serif;
            ">
            {{CommunityName}}
          </div>
        </td>
      </tr>
    </table>
    {{Content}}
  </div>
  <!-- Footer -->
  <div style="
      width: 100%;
      max-width: 480px;
      margin: 24px auto 0 auto;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-family: 'Poppins', Arial, Helvetica, sans-serif;
    ">
    <div style="
        color: #9ca0a8;
        text-align: center;
        font-size: 12px;
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
      ">
      Powered by Scalably
      <br />
      <a href="{{SupportLink}}" style="
          color: #9ca0a8;
          text-decoration: underline;
          font-family: 'Poppins', Arial, Helvetica, sans-serif;
        ">{{SupportEmail}}</a>
    </div>
  </div>
</div>
