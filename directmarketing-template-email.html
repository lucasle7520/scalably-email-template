<!-- Add Google Fonts Poppins import and apply font-family -->
<link
  href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,600&display=swap"
  rel="stylesheet" />
<div
  style="
    height: 100%;
    padding: 40px 16px;
    background: url({BackgroundEmailImage})
      center center / cover no-repeat;
    font-family: 'Poppins', Arial, Helvetica, sans-serif;
    font-size: 14px;
  ">
  <!-- Main card -->
  <div
    style="
      background: rgba(255, 255, 255, 0.95);
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      max-width: 480;
      padding: 40px 32px 32px 32px;
      margin-top: 40px;
      font-family: 'Poppins', Arial, Helvetica, sans-serif;
      font-size: 14px;
    ">
    {Content}
  </div>
  <!-- Footer -->
  <div
    style="
      width: 100%;
      margin-top: 32px;
      font-family: 'Poppins', Arial, Helvetica, sans-serif;
      font-size: 14px;
    ">
    <div
      style="
        color: #9ca0a8;
        text-align: center;
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
        font-size: 14px;
      ">
      <p style="margin-bottom: 0">{SupportTextMessage}</p>
      <a
        href="{SupportLink}"
        style="
          color: #000;
          text-decoration: underline;
          font-family: 'Poppins', Arial, Helvetica, sans-serif;
          font-size: 14px;
        "
        >{SupportEmail}</a
      >
    </div>
  </div>
</div>
