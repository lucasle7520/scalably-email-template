<!-- Add Google Fonts Poppins import and apply font-family -->
<link
  href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,600&display=swap"
  rel="stylesheet" />
<div
  style="
    padding: 40px 16px;
    background: url({BackgroundEmailImage}) center center / cover no-repeat;
    font-family: 'Poppins', Arial, Helvetica, sans-serif;
  ">
  <!-- Main card -->
  <div
    style="
      background: rgba(255, 255, 255, 0.95);
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      padding: 40px 32px 32px 32px;
      margin-top: 40px;
      font-family: 'Poppins', Arial, Helvetica, sans-serif;
    ">
    <!-- Community header -->
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        margin-bottom: 24px;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 20px;
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
      ">
      <tr>
        <td width="40" valign="middle" style="padding-right: 12px">
          <img
            src="{CommunityAvatar}"
            alt="Community Avatar"
            style="width: 40px; height: 40px; border-radius: 8px; display: block" />
        </td>
        <td valign="middle">
          <div
            style="
              font-size: 1rem;
              font-weight: 600;
              color: #1a1a1a;
              font-family: 'Poppins', Arial, Helvetica, sans-serif;
            ">
            {CommunityName}
          </div>
        </td>
      </tr>
    </table>
    <!-- Title -->
    <div style="width: 100%; font-family: 'Poppins', Arial, Helvetica, sans-serif">
      <h2
        style="
          font-size: 1.1rem;
          font-weight: 600;
          color: #1a1a1a;
          margin: 0 0 24px 0;
          text-align: center;
          font-family: 'Poppins', Arial, Helvetica, sans-serif;
        ">
        購入完了：{ItemName}-({OrderID})
      </h2>
    </div>
    <!-- Email body and gift card -->
    <div
      style="
        border-radius: 12px;
        margin-bottom: 24px;
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
      ">
      <div
        style="
          font-size: 1rem;
          color: #222;
          margin-bottom: 8px;
          font-family: 'Poppins', Arial, Helvetica, sans-serif;
        ">
        「{BuyerDisplayName} (@{BuyerScalablyID})」様
      </div>
      <div
        style="
          font-size: 1rem;
          color: #222;
          margin-bottom: 16px;
          font-family: 'Poppins', Arial, Helvetica, sans-serif;
        ">
        {CommunityName}での「{ItemName}」の購入が完了しました。
      </div>
      <div
        style="
          background: #fff;
          border-radius: 16px;
          box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
          padding: 0 0 20px 0;
          margin: 0 auto 0 auto;
          max-width: 250px;
          width: 100%;
          border: 1px solid #f0f0f0;
          font-family: 'Poppins', Arial, Helvetica, sans-serif;
          text-align: center;
        ">
        <div
          style="
            margin: 16px 0;
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
            text-align: center;
            white-space: nowrap;
          ">
          <span
            style="
              display: inline-block;
              vertical-align: middle;
              width: 16px;
              height: 16px;
              border-radius: 50%;
              background-color: #e6e8ec;
              margin-right: 8px;
            "></span>
          <span
            style="
              display: inline-block;
              vertical-align: middle;
              width: 120px;
              height: 16px;
              border-radius: 32px;
              background-color: #e6e8ec;
              margin-right: 8px;
            "></span>
          <span
            style="
              display: inline-block;
              vertical-align: middle;
              width: 16px;
              height: 16px;
              border-radius: 50%;
              background-color: #e6e8ec;
            "></span>
        </div>
        <div
          style="
            width: 100%;
            margin-top: 0;
            margin-bottom: 0;
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
            text-align: center;
          ">
          <img
            src="{ItemImage}"
            alt="Item"
            width="250"
            height="250"
            style="
              width: 100%;
              aspect-ratio: 1 / 1;
              object-fit: cover;
              font-family: 'Poppins', Arial, Helvetica, sans-serif;
              display: inline-block;
            " />
        </div>
        <!-- Item name and community -->
        <div
          style="
            width: 100%;
            margin-top: 18px;
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
            text-align: center;
          ">
          <div
            style="
              font-size: 1.08rem;
              font-weight: 600;
              color: #222;
              margin-bottom: 2px;
              font-family: 'Poppins', Arial, Helvetica, sans-serif;
            ">
            {ItemName}
          </div>
          <div
            style="
              font-size: 0.75rem;
              color: #888;
              margin-bottom: 0;
              font-family: 'Poppins', Arial, Helvetica, sans-serif;
            ">
            {CommunityName}
          </div>
        </div>
      </div>
    </div>
    <!-- Buttons -->
    <div style="width: 100%">
      <div style="text-align: center; margin-bottom: 16px">
        <a
          href="{LinkRedirect}"
          style="
            display: block;
            width: fit-content;
            background: #36499b;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            padding: 10px 36px;
            border-radius: 8px;
            margin-top: 16px;
            margin-bottom: 0;
            margin-right: auto;
            margin-left: auto;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.08);
            transition: background 0.2s;
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
          ">
          商品を確認
        </a>
        <a
          href="{InvoiceRedirect}"
          style="
            display: block;
            width: fit-content;
            border: 1px solid #36499b;
            color: #36499b;
            font-weight: 600;
            font-size: 1rem;
            padding: 10px 36px;
            border-radius: 8px;
            margin-top: 16px;
            margin-bottom: 0;
            margin-right: auto;
            margin-left: auto;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.08);
            transition: background 0.2s;
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
          ">
          領収書を確認
        </a>
      </div>
    </div>
    <!-- In-card footer -->
    <div
      style="
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #e5e7eb;
        font-size: 0.875rem;
        color: #666;
        text-align: center;
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
      ">
      表示名とScalably IDは、プロフィールからいつでも変更できます。
      <a
        href="{ProfileRedirect}"
        style="
          color: #36499b;
          text-decoration: underline;
          font-family: 'Poppins', Arial, Helvetica, sans-serif;
        "
        >プロフィールを設定</a
      >
    </div>
  </div>
  <!-- Footer -->
  <div
    style="
      width: 100%;
      max-width: 480px;
      margin: 24px auto 0 auto;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-family: 'Poppins', Arial, Helvetica, sans-serif;
    ">
    <div
      style="
        color: #9ca0a8;
        text-align: center;
        font-size: 0.75rem;
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
      ">
      Powered by Scalably
    </div>
  </div>
</div>
