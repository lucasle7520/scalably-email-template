<!-- Add Google Fonts Poppins import and apply font-family -->
<link
  href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,600&display=swap"
  rel="stylesheet" />
<div
  style="
    padding: 40px 16px;
    background: url('https://s3.ap-northeast-1.amazonaws.com/test-membership.scalably.com/scalably-membership-svc/development/user/email-bg-4ff71950d8360b7abc38cca5aee40e0e.png')
      center center / cover no-repeat;
    font-family: 'Poppins', Arial, Helvetica, sans-serif;
  ">
  <!-- Main card -->
  <div
    style="
      background: rgba(255, 255, 255, 0.95);
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      padding: 40px 32px 32px 32px;
      margin-top: 40px;
      font-family: 'Poppins', Arial, Helvetica, sans-serif;
    ">
    <!-- Community header -->
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        margin-bottom: 24px;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 20px;
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
      ">
      <tr>
        <td width="40" valign="middle" style="padding-right: 12px">
          <img
            src="{CommunityAvatar}"
            alt="Group Avatar"
            style="width: 40px; height: 40px; border-radius: 8px; display: block" />
        </td>
        <td valign="middle">
          <div
            style="
              font-size: 1rem;
              font-weight: 600;
              color: #1a1a1a;
              font-family: 'Poppins', Arial, Helvetica, sans-serif;
            ">
            {CommunityName}
          </div>
        </td>
      </tr>
    </table>
    <!-- Title -->
    <div style="width: 100%; font-family: 'Poppins', Arial, Helvetica, sans-serif">
      <h2
        style="
          font-size: 1.1rem;
          font-weight: 600;
          color: #1a1a1a;
          margin: 0 0 24px 0;
          text-align: center;
          font-family: 'Poppins', Arial, Helvetica, sans-serif;
        ">
        メールアドレスの確認：{CommunityName}
      </h2>
    </div>
    <!-- Email body -->
    <div
      style="
        border-radius: 12px;
        margin-bottom: 24px;
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
      ">
      <div
        style="
          font-size: 1rem;
          color: #222;
          margin-bottom: 24px;
          font-family: 'Poppins', Arial, Helvetica, sans-serif;
        ">
        {CommunityName}への登録を完了するため、メールアドレスを確認してください。
      </div>
      <!-- Button -->
      <div style="text-align: center">
        <a
          href="{Link Redirect}"
          style="
            display: inline-block;
            background: #36499b;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            padding: 10px 36px;
            border-radius: 8px;
            margin-top: 0;
            margin-bottom: 0;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.08);
            transition: background 0.2s;
            font-family: 'Poppins', Arial, Helvetica, sans-serif;
          ">
          メールアドレスを確認
        </a>
      </div>
      <div
        style="
          font-size: 1rem;
          color: #222;
          margin-top: 24px;
          margin-bottom: 0;
          font-family: 'Poppins', Arial, Helvetica, sans-serif;
        ">
        この登録にお心当たりがない場合は、確認ボタンを押さないでください。
      </div>
    </div>
    <!-- In-card footer -->
    <div
      style="
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #e5e7eb;
        font-size: 0.875rem;
        color: #666;
        text-align: center;
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
      ">
      表示名とScalably IDは、<br />プロフィールからいつでも変更できます。
      <a
        href="{ProfileRedirect}"
        style="
          display: block;
          margin-top: 8px;
          color: #36499b;
          text-decoration: underline;
          font-family: 'Poppins', Arial, Helvetica, sans-serif;
        "
        >プロフィールを設定</a
      >
    </div>
  </div>
  <!-- Footer -->
  <div
    style="
      width: 100%;
      max-width: 480px;
      margin: 24px auto 0 auto;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-family: 'Poppins', Arial, Helvetica, sans-serif;
    ">
    <div
      style="
        color: #9ca0a8;
        text-align: center;
        font-size: 0.75rem;
        font-family: 'Poppins', Arial, Helvetica, sans-serif;
      ">
      Powered by Scalably
    </div>
  </div>
</div>
