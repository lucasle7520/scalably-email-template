<!-- Add Google Fonts Poppins import and apply font-family -->
<link
  href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,600&display=swap"
  rel="stylesheet"
/>
<div
  style="
    padding: 40px 16px;
    background: url({BackgroundEmailImage})
      center center / cover no-repeat;
    font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
  "
>
  <!-- Main card -->
  <div
    style="
      background: rgba(255, 255, 255, 0.95);
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      padding: 40px 32px 32px 32px;
      margin-top: 40px;
      font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
    "
  >
    <!-- Community header -->
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="
        margin-bottom: 24px;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 20px;
        font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
      "
    >
      <tr>
        <td width="40" valign="middle" style="padding-right: 12px">
          <img
            src="{CommunityAvatar}"
            alt="Group Avatar"
            style="
              width: 40px;
              height: 40px;
              border-radius: 8px;
              display: block;
            "
          />
        </td>
        <td valign="middle">
          <div
            style="
              font-size: 1rem;
              font-weight: 600;
              color: #1a1a1a;
              font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
            "
          >
            {CommunityName}
          </div>
        </td>
      </tr>
    </table>
    <!-- Title -->
    <div
      style="
        width: 100%;
        font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
      "
    >
      <h2
        style="
          font-size: 1.1rem;
          font-weight: 600;
          color: #1a1a1a;
          margin: 0 0 24px 0;
          text-align: center;
          font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
        "
      >
        {ExpirationDate}で有効期限が終了します：{MembershipName}
      </h2>
    </div>
    <!-- Email body and membership card -->
    <div
      style="
        border-radius: 12px;
        margin-bottom: 24px;
        font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
      "
    >
      <div
        style="
          font-size: 1rem;
          color: #222;
          margin-bottom: 8px;
          font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
        "
      >
        @{ScalablyID} 様
      </div>
      <div
        style="
          font-size: 1rem;
          color: #222;
          margin-bottom: 16px;
          font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
        "
      >
        {CommunityName}の「{MembershipName}」は、{ExpirationDate}で有効期限が終了します。
      </div>
      <div
        style="
          font-size: 1rem;
          color: #222;
          margin-bottom: 24px;
          font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
        "
      >
        継続をご希望の場合は、新たにメンバーシップをご購入ください。
      </div>
      <!-- Membership image card -->
      <div
        style="
          background: #fff;
          border-radius: 16px;
          box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
          padding: 0 0 20px 0;
          margin: 0 auto 24px auto;
          max-width: 250px;
          width: 100%;
          border: 1px solid #f0f0f0;
          font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
          text-align: center;
        "
      >
        <div
          style="
            margin: 16px 0;
            font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
            text-align: center;
            white-space: nowrap;
          "
        >
          <span
            style="
              display: inline-block;
              vertical-align: middle;
              width: 16px;
              height: 16px;
              border-radius: 50%;
              background-color: #e6e8ec;
              margin-right: 8px;
            "
          ></span>
          <span
            style="
              display: inline-block;
              vertical-align: middle;
              width: 120px;
              height: 16px;
              border-radius: 32px;
              background-color: #e6e8ec;
              margin-right: 8px;
            "
          ></span>
          <span
            style="
              display: inline-block;
              vertical-align: middle;
              width: 16px;
              height: 16px;
              border-radius: 50%;
              background-color: #e6e8ec;
            "
          ></span>
        </div>
        <div
          style="
            width: 100%;
            margin-top: 0;
            margin-bottom: 0;
            font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
            text-align: center;
          "
        >
          <img
            src="{MembershipImage}"
            alt="Membership"
            width="250"
            height="250"
            style="
              width: 100%;
              aspect-ratio: 1 / 1;
              object-fit: cover;
              font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
              display: inline-block;
            "
          />
        </div>
        <div
          style="
            width: 100%;
            margin-top: 18px;
            font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
            text-align: center;
          "
        >
          <div
            style="
              font-size: 1.08rem;
              font-weight: 600;
              color: #222;
              margin-bottom: 2px;
              font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
            "
          >
            {MembershipName}
          </div>
          <div
            style="
              font-size: 0.75rem;
              color: #888;
              margin-bottom: 0;
              font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
            "
          >
            {CommunityName}
          </div>
        </div>
      </div>
      <!-- Button -->
      <div style="text-align: center">
        <a
          href="{LinkRedirect}"
          style="
            display: inline-block;
            background: #36499b;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            padding: 10px 36px;
            border-radius: 8px;
            margin-top: 0;
            margin-bottom: 0;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.08);
            transition: background 0.2s;
            font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
          "
        >
          メンバーシップを選ぶ
        </a>
      </div>
    </div>
  </div>
  <!-- Footer -->
  <div
    style="
      width: 100%;
      max-width: 480px;
      margin: 24px auto 0 auto;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
    "
  >
    <div
      style="
        color: #9ca0a8;
        text-align: center;
        font-size: 0.75rem;
        font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
      "
    >
      Powered by Scalably
    </div>
  </div>
</div>
