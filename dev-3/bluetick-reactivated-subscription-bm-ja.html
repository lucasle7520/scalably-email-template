<!-- Add Google Fonts Poppins import and apply font-family -->
<link
  href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,600&display=swap"
  rel="stylesheet"
/>
<div
  style="
    padding: 40px 16px;
    background: url(&quot;https://s3.ap-northeast-1.amazonaws.com/test-membership.scalably.com/scalably-membership-svc/development/user/email-bg-4ff71950d8360b7abc38cca5aee40e0e.png&quot;)
      center center / cover no-repeat;
    font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
  "
>
  <!-- Main card -->
  <div
    style="
      background: rgba(255, 255, 255, 0.95);
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      max-width: 480px;
      padding: 40px 32px 32px 32px;
      margin-top: 40px;
      font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
    "
  >
    <!-- Title -->
    <div
      style="
        width: 100%;
        font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
      "
    >
      <h2
        style="
          font-size: 1.1rem;
          font-weight: 600;
          color: #1a1a1a;
          margin: 0 0 24px 0;
          text-align: center;
          font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
        "
      >
        Blue Badgeサブスクリプションが再開されました
      </h2>
    </div>
    <!-- Email body -->
    <div
      style="
        border-radius: 12px;
        margin-bottom: 24px;
        font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
      "
    >
      <div
        style="
          font-size: 1rem;
          color: #222;
          margin-bottom: 8px;
          font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
        "
      >
        @{ScalablyID} 様
      </div>
      <p
        style="
          font-size: 1rem;
          color: #222;
          margin-bottom: 24px;
          font-weight: 600;
          font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
        "
      >
        おかえりなさい！
      </p>
      <p
        style="
          font-size: 1rem;
          color: #222;
          margin-bottom: 24px;
          font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
        "
      >
        <strong>Blue Badge</strong> のサブスクリプションが正常に再開されました。<br />
        次回の請求日は <strong>{NextBillingDate}</strong> です。お支払いはその時点で自動的に処理されます。
      </p>

      <p
        style="
          font-size: 1rem;
          color: #222;
          margin-bottom: 16px;
          font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
        "
      >
        🔍 <strong>サブスクリプションの詳細はこちら:</strong>
      </p>

      <!-- Button -->
      <div style="text-align: center; margin-bottom: 24px">
        <a
          href="{MySubscriptionLink}"
          style="
            display: block;
            width: fit-content;
            background: #36499b;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            padding: 10px 36px;
            border-radius: 8px;
            margin-top: 16px;
            margin-bottom: 0;
            margin-right: auto;
            margin-left: auto;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.08);
            transition: background 0.2s;
            font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
          "
        >
          My Subscription
        </a>
      </div>

      <div>
        <p
          style="
            font-size: 1rem;
            color: #222;
            margin-bottom: 8px;
            font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
          "
        >
          よろしくお願いいたします。
        </p>
        <p
          style="
            font-size: 1rem;
            color: #222;
            margin-bottom: 8px;
            font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
          "
        >
          <strong>Scalablyチーム</strong>
        </p>
      </div>
    </div>
  </div>
  <!-- Footer -->
  <div
    style="
      width: 100%;
      margin-top: 32px;
      font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
    "
  >
    <div style="text-align: center">
      <img
        src="https://s3.ap-northeast-1.amazonaws.com/test-membership.scalably.com/scalably-membership-svc/development/user/scalably-logo-98676aa0ba659bfa58f61dd7554e112c.png"
        alt="Scalably Logo"
        style="
          width: 160px;
          height: 39px;
          margin-bottom: 8px;
          margin-top: 32px;
          display: inline-block;
        "
      />
    </div>
    <div
      style="
        color: #9ca0a8;
        text-align: center;
        margin-bottom: 2px;
        font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
      "
    >
      ※このメールは自動送信されています。返信はできません。<br />
      ご不明な点がございましたら、<a
        href="mailto:support@scalably.com"
        style="
          color: #000;
          text-decoration: underline;
          font-family: &quot;Poppins&quot;, Arial, Helvetica, sans-serif;
        "
        >support@scalably.com</a
      > までお気軽にお問い合わせください。
    </div>
  </div>
</div>
